<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>เปลี่ยนรหัสผ่าน</title></head>
<body><div layout:fragment="content">
    <div class="page-head"><div><span class="eyebrow">ACCOUNT SECURITY</span><h1 class="page-title">เปลี่ยนรหัสผ่าน</h1><p class="page-sub">รหัสผ่านใหม่ต้องมีอย่างน้อย 12 ตัวอักษร</p></div></div>
    <div class="alert alert-success" role="status" th:if="${successMessage}"><span class="alert-body" th:text="${successMessage}"></span></div>
    <div class="alert alert-error" role="alert" th:if="${errorMessage}"><span class="alert-body" th:text="${errorMessage}"></span></div>
    <section class="card auth-card"><div class="card-body"><form method="post" th:action="@{/account/password}">
        <div class="field"><label for="currentPassword">รหัสผ่านปัจจุบัน</label><input class="control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="newPassword">รหัสผ่านใหม่</label><input class="control" id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required></div>
        <div class="field"><label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label><input class="control" id="confirmPassword" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></div>
        <button class="btn btn-primary" type="submit">บันทึกรหัสผ่านใหม่</button>
    </form></div></section>
</div></body></html>
