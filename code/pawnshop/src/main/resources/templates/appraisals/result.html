<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ผลประเมินทรัพย์</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:700px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">ผลประเมินราคา</h1><p class="text-muted" th:text="${item.description}"></p>
<dl class="row"><dt class="col-sm-6">มูลค่าประเมิน</dt><dd class="col-sm-6" th:text="|${#numbers.formatDecimal(appraisal.appraisedValue,1,2)} บาท|"></dd><dt class="col-sm-6">วงเงินจำนำสูงสุด</dt><dd class="col-sm-6 fw-bold" th:text="|${#numbers.formatDecimal(appraisal.maxLoanAmount,1,2)} บาท|"></dd><dt class="col-sm-6" th:if="${appraisal.goldPriceSnapshot != null}">ราคาทองที่ใช้ (บาท/กรัม)</dt><dd class="col-sm-6" th:if="${appraisal.goldPriceSnapshot != null}" th:text="${#numbers.formatDecimal(appraisal.goldPriceSnapshot,1,2)}"></dd></dl>
<a class="btn btn-outline-primary" th:href="@{/appraisals/new}">ประเมินชิ้นถัดไป</a></div></div></main></body></html>
