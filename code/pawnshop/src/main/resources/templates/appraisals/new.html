<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ลงทะเบียนและประเมินทรัพย์</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:850px"><h1 class="h3 mb-4">ลงทะเบียนและประเมินทรัพย์</h1>
<form th:action="@{/appraisals}" th:object="${item}" method="post" class="card card-body shadow-sm"><div class="row g-3">
<div class="col-md-6"><label class="form-label">ประเภททรัพย์</label><select class="form-select" th:field="*{itemType}" required><option value="">เลือกประเภท</option><option th:each="type : ${itemTypes}" th:value="${type}" th:text="${type}"></option></select><div class="text-danger" th:errors="*{itemType}"></div></div>
<div class="col-md-6"><label class="form-label">รายละเอียด</label><input class="form-control" th:field="*{description}" required maxlength="300"><div class="text-danger" th:errors="*{description}"></div></div>
<div class="col-md-6"><label class="form-label">เลขประจำทรัพย์/Serial</label><input class="form-control" th:field="*{serialNumber}"></div>
<div class="col-md-6"><label class="form-label">น้ำหนักทอง (กรัม)</label><input class="form-control" type="number" step="0.001" th:field="*{weightGram}"></div>
<div class="col-md-6"><label class="form-label">ความบริสุทธิ์ทอง (%)</label><input class="form-control" type="number" step="0.01" th:field="*{purityPercent}"></div>
<div class="col-md-6"><label class="form-label">ปีผลิต (เครื่องใช้ไฟฟ้า)</label><input class="form-control" type="number" th:field="*{manufactureYear}"></div>
<div class="col-md-6"><label class="form-label">ราคาอ้างอิงรุ่น (บาท)</label><input class="form-control" type="number" step="0.01" th:field="*{referencePrice}"></div>
<div class="col-md-6"><label class="form-label">เกรดสภาพ (1-5)</label><input class="form-control" type="number" min="1" max="5" th:field="*{conditionGrade}"></div>
<div class="col-md-6"><label class="form-label">ตำแหน่งจัดเก็บ</label><input class="form-control" th:field="*{storageSlot}"></div>
<div class="col-md-6"><label class="form-label">รหัสพนักงานผู้ประเมิน</label><input class="form-control" type="number" th:field="*{appraiserId}"></div>
</div><button class="btn btn-primary mt-4 align-self-start" type="submit">บันทึกและประเมินราคา</button></form></main></body></html>
