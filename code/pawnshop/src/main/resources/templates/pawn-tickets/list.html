<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>รายการตั๋วจำนำ</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>รายการตั๋วจำนำ</h2>
        <a class="btn btn-primary" th:href="@{/pawn-tickets/new}">+ รับจำนำ</a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form class="row g-2 mb-3" th:action="@{/pawn-tickets}" method="get">
        <div class="col-auto">
            <input class="form-control" name="number" th:value="${number}" placeholder="เลขที่ตั๋ว เช่น PT000001">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">ค้นหา</button>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>เลขที่</th>
            <th>ลูกค้า</th>
            <th>ทรัพย์</th>
            <th class="text-end">เงินต้น</th>
            <th>ครบกำหนด</th>
            <th>สถานะ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tickets.content}">
            <td><a th:href="@{/pawn-tickets/{id}(id=${t.id})}" th:text="${t.ticketNumber}">PT000001</a></td>
            <td th:text="${t.customerName}">-</td>
            <td th:text="${t.itemDescription}">-</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(t.principal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            <td th:text="${t.dueDate}">-</td>
            <td><span class="badge bg-secondary" th:text="${t.statusDisplay}">-</span></td>
        </tr>
        <tr th:if="${tickets.empty}">
            <td colspan="6" class="text-center text-muted">ยังไม่มีตั๋วจำนำ</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${tickets.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${tickets.first} ? 'disabled'">
                <a class="page-link" th:href="@{/pawn-tickets(page=${tickets.number - 1})}">ก่อนหน้า</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|${tickets.number + 1} / ${tickets.totalPages}|">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${tickets.last} ? 'disabled'">
                <a class="page-link" th:href="@{/pawn-tickets(page=${tickets.number + 1})}">ถัดไป</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
