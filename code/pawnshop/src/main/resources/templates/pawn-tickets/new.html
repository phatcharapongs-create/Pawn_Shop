<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>รับจำนำ</title>
    <link rel="stylesheet" th:href="@{/css/ticket.css}">
</head>
<body>
<div layout:fragment="content">

    <div class="page-head">
        <div>
            <span class="eyebrow">NEW TICKET</span>
            <h1 class="page-title">รับจำนำ / ออกตั๋วใหม่</h1>
            <p class="page-sub">บันทึกรายการรับจำนำและออกตั๋วให้ลูกค้า</p>
        </div>
    </div>

    <div class="alert alert-info" role="note">
        <span class="alert-body">ทรัพย์ต้องผ่านการประเมินราคาก่อน (เมนู <a th:href="@{/appraisals/new}"><strong>ประเมินราคา</strong></a>) แล้วนำรหัสทรัพย์มากรอกที่นี่</span>
    </div>
    <div class="alert alert-error" role="alert" th:if="${error}">
        <span class="alert-body" th:text="${error}">เกิดข้อผิดพลาด</span>
    </div>

    <section class="card form-card">
        <div class="card-head">
            <h2>รายละเอียดตั๋วจำนำ</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/pawn-tickets}" th:object="${form}" method="post">
                <div class="form-grid">

                    <div class="field">
                        <label for="customerId">รหัสลูกค้า</label>
                        <input id="customerId" type="number" class="control" th:field="*{customerId}"
                               th:classappend="${#fields.hasErrors('customerId')} ? 'is-invalid'">
                        <small class="field-error" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></small>
                    </div>

                    <div class="field">
                        <label for="pledgedItemId">รหัสทรัพย์ที่ประเมินแล้ว</label>
                        <input id="pledgedItemId" type="number" class="control" th:field="*{pledgedItemId}"
                               th:classappend="${#fields.hasErrors('pledgedItemId')} ? 'is-invalid'">
                        <small class="field-error" th:if="${#fields.hasErrors('pledgedItemId')}" th:errors="*{pledgedItemId}"></small>
                    </div>

                    <div class="field span-2">
                        <label for="principal">เงินต้นที่ขอ (บาท)</label>
                        <input id="principal" type="number" step="0.01" class="control" th:field="*{principal}"
                               th:classappend="${#fields.hasErrors('principal')} ? 'is-invalid'">
                        <small class="field-hint">ต้องไม่เกินวงเงินสูงสุดจากผลประเมิน</small>
                        <small class="field-error" th:if="${#fields.hasErrors('principal')}" th:errors="*{principal}"></small>
                    </div>

                    <div class="field span-2">
                        <label for="employeeId">รหัสพนักงาน <span class="muted">(ไม่บังคับ)</span></label>
                        <input id="employeeId" type="number" class="control" th:field="*{employeeId}">
                    </div>

                </div>

                <div class="form-actions">
                    <a th:href="@{/pawn-tickets}" class="btn btn-outline">ยกเลิก</a>
                    <button type="submit" class="btn btn-primary">ออกตั๋ว</button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
